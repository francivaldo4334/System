<script>
    $q.use(
        ['times'],
        () => {
            const date = '{{ default_dt_value }}';
            if (!date || date === 'None') throw Error('date is null');

            let url = `{% url 'availabilities_presentation' %}?day=${date}`;

            // RESOLUÇÃO DO TIMEZONE PARA HOJE:
            // Geramos a data de hoje baseada pura e estritamente no fuso horário do navegador
            const now = new Date();
            const todayLocalStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

            // Se a data selecionada for igual ao hoje do dispositivo do usuário
            if (date === todayLocalStr) {
                // Captura hora e minuto locais com garantia de 2 dígitos (HH:MM)
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                const time = `${hours}:${minutes}`;

                url += `&current_time=${time}`;
            }

            return $r.get(url);
        },
        {
            onSuccess(data) {
                const times = Array.from(
                    new Set(
                        data.flatMap(a =>
                            a.occurrences.map(it => JSON.stringify({
                                time: it.split('T')[1],
                                id: a.id,
                            }))
                        )
                    )
                )
                    .map(it => JSON.parse(it))
                    .sort((a, b) => a.time.localeCompare(b.time));

                const ul = document.getElementById('{{ ul_id }}');

                const calcSlot = (it) => {
                    const [hour, minute] = it.split(':').map(Number);
                    return Math.floor((hour * 60 + minute) / 5);
                };

                if (ul) {
                    const frag = document.createDocumentFragment();

                    times.forEach(it => {
                        const li = document.createElement('li');
                        const a = document.createElement('a');
                        const slot = calcSlot(it.time);

                        a.innerText = it.time.slice(0, 5);

                        // CORREÇÃO DOS COMENTÁRIOS DJANGO: 
                        // Condicionais do Django controlam a existência do bloco JS de forma limpa
                        {% if set_href %}
                        a.href = `{% url 'self_scheduling' %}?step=5&service={{ request.GET.service }}&resource={{ request.GET.resource }}&date={{ request.GET.date }}&time=${it.time}&availability=${it.id}&slot=${slot}`;
                        {% endif %}

                        {% if onclick %}
                        a.onclick = () => {
                            ((contextData) => {
                                {{onclick} } // Corrigido espaçamento que quebrava o template
                            })({
                                availabilityId: it.id,
                                time: it.time,
                                slot,
                            });
                        };
                        {% endif %}

                        li.appendChild(a);
                        frag.appendChild(li);
                    });

                    // CORREÇÃO DO REFETCH: 
                    // substitui os filhos antigos para evitar duplicação em caso de refetch
                    ul.replaceChildren(frag);
                }
            }
        },
        {
            enableRefetch: true,
        }
    )
</script>
