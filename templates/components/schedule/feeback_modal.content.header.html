<div class="p-6 pb-4 border-b border-base-200 flex items-center justify-between bg-base-50">
    <div>
        <h3 class="text-lg font-bold tracking-tight">
            {%trans "Feedback central"%}
        </h3>
        <p class="text-xs text-base-content/60">
            {%trans "Your opinion builds our platform."%}
        </p>
    </div>
    <label for="feedback-drawer" class="btn btn-sm btn-circle btn-ghost *:w-4">
        {%include "icons/x.svg"%}
    </label>
</div>
<div class="px-4 py-2">
    <div class="alert alert-info alert-soft items-start text-xs [&>svg]:w-4">
        {%include 'icons/clock-alert.svg'%}
        <div>
            <span class="font-bold block">
                {%trans "Response Time"%}
            </span>
            <p>
                {%trans "We carefully analyze all interactions."%}
                {%trans "The average time for a response or technical update is <strong>up to 15 days</strong>."%}
            </p>
        </div>
    </div>
</div>
