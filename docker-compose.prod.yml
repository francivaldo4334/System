version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: prod_db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: prod_redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    restart: always
    networks:
      - default

  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: prod_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_volume:/app/staticfiles  
      - media_volume:/app/mediafiles
      # - static_volume:/usr/share/nginx/html/static/  # Alinhado com o caminho do seu Nginx
      # - media_volume:/usr/share/nginx/html/media/    # Alinhado com o caminho do seu Nginx
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DJANGO_SETTINGS_MODULE=core.settings.prod

  # Adicione o worker aqui para processar as tarefas
  celery_worker:
    build: .
    command: python -m celery -A core worker -l info
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
    env_file:
      - .env
    depends_on:
      - db
      - redis
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - DJANGO_SETTINGS_MODULE=core.settings.prod

  # Adicione o beat aqui para o agendamento
  celery_beat:
    build: .
    command: python -m celery -A core beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
    env_file:
      - .env
    depends_on:
      - db
      - redis
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - DJANGO_SETTINGS_MODULE=core.settings.prod

  nginx:  # <--- ADICIONADO AQUI
    image: nginx:alpine
    container_name: prod_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/usr/share/nginx/html/static/:ro  # O Nginx apenas lê (read-only)
      - media_volume:/usr/share/nginx/html/media/:ro
      # - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # - static_volume:/usr/share/nginx/html/static/
      # - media_volume:/usr/share/nginx/html/media/
    depends_on:
      web:
        condition: service_started
    # depends_on:
    #   - web
    restart: always

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
