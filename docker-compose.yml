version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: ponto_agio_db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      # O Postgres original usa estas variáveis para criar o banco e o usuário iniciais
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      # Ajustado aqui também para bater com o usuário e banco definidos acima
      test: ["CMD-SHELL", "pg_isready -U ponto_agio_admin -d ponto_agio_prod"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: django_app
    command: >
      sh -c "uv run python manage.py migrate &&
             uv run python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - /app/.venv/
      - uv_cache:/root/.cache/uv
    ports:
      - "8000:8000"

    env_file:
      - .env
    environment:
      - DEBUG=1
      - DB_HOST=db
      - DJANGO_SETTINGS_MODULE=core.settings.prod
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  uv_cache:
